name: Build Mini Arena Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Check Flutter project files
        run: |
          test -f pubspec.yaml || (echo 'ERROR: pubspec.yaml tidak ditemukan di root repository.' && exit 1)
          test -f lib/main.dart || (echo 'ERROR: lib/main.dart tidak ditemukan di root repository.' && exit 1)
          test -f android/gradlew || (echo 'ERROR: android/gradlew tidak ditemukan.' && exit 1)

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code (informational)
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build universal release APK
        id: build_universal
        run: flutter build apk --release

      - name: Build APKs for individual CPU architectures
        run: flutter build apk --release --split-per-abi

      - name: Upload APK files
        if: always() && (success() || steps.build_universal.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: mini-arena-android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-diagnostics
          path: |
            pubspec.yaml
            android/gradle/wrapper/gradle-wrapper.properties
            build/app/outputs/flutter-apk/
          if-no-files-found: ignore
          retention-days: 7
