name: Build VINZZX STUDIO APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build split APKs (per ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair missing Android platform wrapper if needed
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml || { echo 'ERROR: pubspec.yaml tidak ditemukan di root repository.'; exit 1; }
          test -f lib/main.dart || { echo 'ERROR: lib/main.dart tidak ditemukan di root repository.'; exit 1; }

          # Some web upload methods omit Android wrapper files. Regenerate platform
          # scaffolding if gradlew is missing, while preserving the Flutter app source.
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo 'Android Gradle wrapper missing; regenerating Android platform files...'
            flutter create --platforms=android --project-name vinzzx_studio .
          fi

          test -f android/gradlew || { echo 'ERROR: android/gradlew masih tidak ditemukan setelah regenerasi.'; exit 1; }
          test -f android/gradle/wrapper/gradle-wrapper.jar || { echo 'ERROR: gradle-wrapper.jar tidak ditemukan.'; exit 1; }
          chmod +x android/gradlew

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code (informational)
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build release APKs split by ABI
        run: flutter build apk --release --split-per-abi

      - name: Verify split APK outputs
        run: |
          set -euo pipefail
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: vinzzx-studio-split-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vinzzx-studio-build-diagnostics
          path: |
            pubspec.yaml
            android/gradle/wrapper/gradle-wrapper.properties
            build/app/outputs/flutter-apk/
          if-no-files-found: ignore
          retention-days: 7
