name: Build Flutter APK
run-name: Flutter APK Build ${{ inputs.build_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: 'Path to uploaded Flutter project ZIP in this repository'
        required: false
        type: string
      build_id:
        description: 'Build ID used by the mobile builder to find this run'
        required: false
        type: string

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter source
        id: source
        shell: bash
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          if [[ -n "${SOURCE_PATH:-}" ]]; then
            if [[ ! -f "$SOURCE_PATH" ]]; then
              echo "ERROR: Source ZIP tidak ditemukan: $SOURCE_PATH"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/flutter-source"
            unzip -q "$SOURCE_PATH" -d "$RUNNER_TEMP/flutter-source"
            ROOT=$(find "$RUNNER_TEMP/flutter-source" -type f -name pubspec.yaml -print -quit | xargs -r dirname)
            if [[ -z "$ROOT" || ! -f "$ROOT/lib/main.dart" ]]; then
              echo 'ERROR: ZIP tidak berisi proyek Flutter valid (pubspec.yaml dan lib/main.dart).'
              exit 1
            fi
            echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"
          else
            if [[ ! -f pubspec.yaml || ! -f lib/main.dart ]]; then
              echo 'ERROR: Push biasa memicu build, tetapi root repository bukan proyek Flutter. Untuk build ZIP gunakan tombol Build di aplikasi.'
              exit 1
            fi
            echo "project_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Flutter dependencies
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze Dart code (non-blocking)
        working-directory: ${{ steps.source.outputs.project_dir }}
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build release APKs
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apks
          path: ${{ steps.source.outputs.project_dir }}/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-diagnostics
          path: |
            ${{ steps.source.outputs.project_dir }}/pubspec.yaml
            ${{ steps.source.outputs.project_dir }}/.dart_tool/package_config.json
          if-no-files-found: ignore
          retention-days: 7
